unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g status-interval 5
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1
bind -r C-h select-window -t :-1
bind -r C-l select-window -t :+1

bind C-c new-session
bind x kill-pane
bind X kill-window
bind C-x kill-session
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Y send-keys -X copy-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi / command-prompt -i -p "search down" "send-keys -X search-forward-incremental '%%%'"
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send-keys -X search-backward-incremental '%%%'"
bind p paste-buffer

bind -T root F12 set prefix None \; set key-table off \; set status-bg colour88 \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; set status-bg black \; refresh-client -S

set -g status-position top
set -g status-left-length 40
set -g status-left "[#S] "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g status-right-length 150
set -g status-right "#{prefix_highlight}#(gitmux -timeout 500ms -cfg $HOME/.cache/wallust/gitmux.conf '#{pane_current_path}') CPU:#{cpu_percentage} RAM:#{ram_percentage} GPU:#{gpu_percentage} | %H:%M %d-%b"

source-file -q ~/.cache/wallust/tmux-colors.conf

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if "test ! -d ~/.local/share/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run '~/.local/share/tmux/plugins/tpm/tpm'
