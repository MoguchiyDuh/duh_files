set -g  status-style                    "bg={{ colors.surface.default.hex }},fg={{ colors.on_surface_variant.default.hex }}"
set -g  pane-border-style               "fg={{ colors.outline_variant.default.hex }}"
set -g  pane-active-border-style        "fg={{ colors.primary.default.hex }},bold"
setw -g window-status-style             "bg={{ colors.surface.default.hex }},fg={{ colors.secondary.default.hex }}"
setw -g window-status-current-style    "bg={{ colors.primary.default.hex }},fg={{ colors.surface.default.hex }},bold"
set -g  mode-style                      "bg={{ colors.primary.default.hex }},fg={{ colors.surface.default.hex }}"
set -g  message-style                   "bg={{ colors.tertiary.default.hex }},fg={{ colors.surface.default.hex }}"
set -g  message-command-style           "bg={{ colors.tertiary.default.hex }},fg={{ colors.surface.default.hex }}"

set -g  @dyn_prefix_fg              "{{ colors.surface.default.hex }}"
set -g  @dyn_prefix_bg              "{{ colors.tertiary.default.hex }}"
set -g  @dyn_copy_fg                "{{ colors.surface.default.hex }}"
set -g  @dyn_copy_bg                "{{ colors.primary.default.hex }}"
