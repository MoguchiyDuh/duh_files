[meta]
name = "fluid"
label = "Fluid"
description = "Cinematic weighty transitions with slow ambient border rotation"

[curves]
wind = { bezier = [0.05, 0.85, 0.03, 0.97] }
easeOutCirc = { bezier = [0.00, 0.48, 0.38, 1.00] }
easeInOutCirc = { bezier = [0.75, 0.00, 0.15, 1.00] }
menu_decel = { bezier = [0.05, 0.82, 0.00, 1.00] }
menu_accel = { bezier = [0.20, 0.00, 0.82, 0.10] }

[animations]
border = { speed = 2.0, curve = "easeInOutCirc" }
borderangle = { speed = 90, curve = "easeInOutCirc", style = "loop" }
windowsIn = { speed = 4.5, curve = "wind", style = "slide" }
windowsOut = { speed = 4.0, curve = "easeOutCirc" }
windowsMove = { speed = 4.2, curve = "wind", style = "slide" }
fade = { speed = 3.0, curve = "menu_decel" }
layersIn = { speed = 3.0, curve = "menu_decel", style = "slide" }
layersOut = { speed = 2.6, curve = "menu_accel" }
fadeLayersIn = { speed = 2.6, curve = "menu_decel" }
fadeLayersOut = { speed = 3.0, curve = "menu_accel" }
workspaces = { speed = 5.5, curve = "wind", style = "slide" }
specialWorkspace = { speed = 3.5, curve = "menu_decel", style = "slidefadevert 15%" }
