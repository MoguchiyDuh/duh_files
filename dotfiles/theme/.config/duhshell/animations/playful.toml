[meta]
name = "playful"
label = "Playful"
description = "Bouncy overshot transitions for windows and workspaces"

[curves]
overshot = { bezier = [0.05, 0.85, 0.07, 1.04] }
crazyshot = { bezier = [0.10, 1.22, 0.68, 0.98] }
OutBack = { bezier = [0.28, 1.40, 0.58, 1.00] }
md3_accel = { bezier = [0.20, 0.00, 0.80, 0.08] }

[animations]
border = { speed = 1.6, curve = "overshot" }
borderangle = { speed = 50, curve = "overshot", style = "loop" }
windowsIn = { speed = 3.5, curve = "crazyshot", style = "popin 60%" }
windowsOut = { speed = 2.6, curve = "md3_accel" }
windowsMove = { speed = 3.2, curve = "OutBack", style = "slide" }
fade = { speed = 1.8, curve = "overshot" }
layersIn = { speed = 2.2, curve = "crazyshot", style = "slide" }
layersOut = { speed = 1.6, curve = "md3_accel" }
fadeLayersIn = { speed = 2.0, curve = "overshot" }
fadeLayersOut = { speed = 1.6, curve = "md3_accel" }
workspaces = { speed = 3.6, curve = "OutBack", style = "slide" }
specialWorkspace = { speed = 2.4, curve = "crazyshot", style = "slidefadevert 15%" }
