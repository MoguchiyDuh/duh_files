[meta]
name = "snappy"
label = "Snappy"
description = "Punchy MD3 transitions with visible travel and no bounce"

[curves]
md3_decel = { bezier = [0.05, 0.80, 0.10, 0.97] }
md3_accel = { bezier = [0.20, 0.00, 0.80, 0.08] }
easeOutExpo = { bezier = [0.10, 0.94, 0.23, 0.98] }

[animations]
border = { speed = 1.2, curve = "default" }
borderangle = { speed = 30, curve = "default", style = "loop" }
windowsIn = { speed = 2.6, curve = "md3_decel", style = "popin 70%" }
windowsOut = { speed = 2.2, curve = "md3_accel", style = "popin 70%" }
windowsMove = { speed = 2.2, curve = "md3_decel" }
fade = { speed = 1.8, curve = "md3_decel" }
layersIn = { speed = 1.8, curve = "md3_decel", style = "slide" }
layersOut = { speed = 1.4, curve = "md3_accel" }
fadeLayersIn = { speed = 1.6, curve = "md3_decel" }
fadeLayersOut = { speed = 1.4, curve = "md3_accel" }
workspaces = { speed = 2.8, curve = "easeOutExpo", style = "slide" }
specialWorkspace = { speed = 2.2, curve = "md3_decel", style = "slidevert" }
