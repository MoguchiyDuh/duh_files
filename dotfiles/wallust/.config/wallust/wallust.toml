backend = "fastresize"
palette = "salience"
style = "dark"
check_contrast = true

[salience]
sampling = "high"
intensity = "vibrant"

[templates]
kitty.template = 'kitty-colors.conf'
kitty.target = '~/.cache/wallust/kitty-colors.conf'
ghostty.template = 'ghostty-colors'
ghostty.target = '~/.cache/wallust/ghostty-colors'
hypr.template = 'hyprland-colors.conf'
hypr.target = '~/.cache/wallust/hypr-colors.conf'
hypr_lua.template = 'hyprland-colors.lua'
hypr_lua.target = '~/.cache/wallust/colors.lua'
waybar.template = 'waybar-colors.css'
waybar.target = '~/.cache/wallust/waybar-colors.css'
btop.template = 'btop-colors.theme'
btop.target = '~/.config/btop/themes/wallust.theme'
cava.template = 'cava-colors'
cava.target = '~/.config/cava/config'
swaync.template = 'swaync-colors.css'
swaync.target = '~/.cache/wallust/swaync-colors.css'
gtk4.template = 'gtk-colors.css'
gtk4.target = '~/.cache/wallust/gtk-colors.css'
gtk3.template = 'gtk-colors.css'
gtk3.target = '~/.cache/wallust/gtk-colors.css'
qt5ct.template = 'qt5ct-colors.conf'
qt5ct.target = '~/.cache/wallust/qt5ct-colors.conf'
tmux.template = 'tmux-colors.conf'
tmux.target = '~/.cache/wallust/tmux-colors.conf'
gitmux.template = 'gitmux.conf'
gitmux.target = '~/.cache/wallust/gitmux.conf'
nvim.template = 'nvim-colors.lua'
nvim.target = '~/.local/share/nvim/site/colors/wallust.lua'
walker.template = 'walker-colors.css'
walker.target = '~/.cache/wallust/walker-colors.css'

[hooks]
hyprland = 'hyprctl reload >/dev/null 2>&1 || true'
nvim = 'pgrep -x nvim >/dev/null && pkill -USR1 -x nvim || true'
waybar = 'systemctl --user restart waybar.service || true'
tmux = 'tmux ls >/dev/null 2>&1 && tmux source-file -q ~/.cache/wallust/tmux-colors.conf || true'
swaync = 'swaync-client --reload-css >/dev/null 2>&1 || true'
walker = 'systemctl --user try-restart walker.service >/dev/null 2>&1 || true'
# opencode = 'pkill -u "$(id -u)" -SIGUSR2 -x opencode 2>/dev/null || true'

[templated_hooks]
awww = """ln -sf "{{wallpaper}}" ~/.cache/current_wallpaper.png"""
