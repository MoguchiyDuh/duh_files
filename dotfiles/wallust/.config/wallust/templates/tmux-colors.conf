set -g status-style "bg={{background}},fg={{color15}}"
set -g pane-border-style "fg={{color8}}"
set -g pane-active-border-style "fg={{color4}},bold"
setw -g window-status-style "bg={{background}},fg={{color14}}"
setw -g window-status-current-style "bg={{color5}},fg={{color15}},bold"
set -g mode-style "bg={{color5}},fg={{color15}}"
set -g message-style "bg={{color4}},fg={{color15}}"
set -g message-command-style "bg={{color5}},fg={{color15}}"
set -g @prefix_highlight_fg "{{background}}"
set -g @prefix_highlight_bg "{{color5}}"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg={{background}},bg={{color4}}"
