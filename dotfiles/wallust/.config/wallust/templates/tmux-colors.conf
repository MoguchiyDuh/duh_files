# tmux colors generated by wallust
set -g pane-active-border-style "fg={{color4}},bold"
setw -g window-status-current-style "bg={{color4}},fg=white,bold"
set -g mode-style "bg={{color5}},fg=white"
set -g message-style "bg={{color4}},fg=white"
set -g message-command-style "bg={{color5}},fg=white"
set -g @prefix_highlight_bg "{{color4}}"
set -g @prefix_highlight_copy_mode_attr "fg=white,bg={{color5}}"
