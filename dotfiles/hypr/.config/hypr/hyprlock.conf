source=~/.cache/dyntheme/hypr-colors.conf
source=~/.cache/dyntheme/hyprlock-colors.conf

$UI = FiraCode Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 2000
    screencopy_mode = 1
}

animations {
    enabled = true
    bezier = snappy, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 4, snappy
    animation = fadeOut, 1, 4, snappy
    animation = inputFieldColors, 1, 3, snappy
    animation = inputFieldDots, 1, 2, snappy
}

background {
    monitor =
    path = ~/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.89
    brightness = 0.45
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = cmd[update:10000] echo "<span letter_spacing='4096'>$(date +'%A, %B %d' | tr '[:lower:]' '[:upper:]')</span>"
    color = $hl_muted
    font_size = 15
    font_family = $UI Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 0, 340
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $hl_text
    font_size = 120
    font_family = $UI Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $hl_shadow
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] "$HOME/.config/hypr/scripts/media_info.sh" | head -1
    color = $hl_primary
    font_size = 15
    font_family = $UI Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 0, 122
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] "$HOME/.config/hypr/scripts/media_info.sh" | tail -1
    color = $hl_muted
    font_size = 11
    font_family = $UI
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, <span foreground='##$hx_primary'><b>$USER</b></span>
    color = $hl_muted
    font_size = 14
    font_family = $UI
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 58
    outline_thickness = 2
    rounding = 16
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $hl_primary $hl_tertiary 0deg
    inner_color = $hl_field
    font_color = $hl_text
    font_family = $UI
    fade_on_empty = false
    placeholder_text = <span foreground='##$hx_muted'>󰌾  Enter password</span>
    hide_input = false
    check_color = $hl_tertiary
    fail_color = $hl_error
    fail_text = <span foreground='##$hx_error'>$FAIL <b>($ATTEMPTS)</b></span>
    swap_font_color = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $hl_shadow
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span foreground='##$hx_primary'>󰅐</span>  $(uptime -p | sed 's/up //')"
    color = $hl_muted
    font_size = 13
    font_family = $UI
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 36, 32
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$bat" ] && echo "<span foreground='##$hx_primary'>󰁹</span>  $bat%" || echo ""
    color = $hl_muted
    font_size = 13
    font_family = $UI
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = 36, 62
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span foreground='##$hx_primary'>󰌌</span>  $LAYOUT[US,RU]
    color = $hl_muted
    font_size = 13
    font_family = $UI Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = -36, 32
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:250] grep -qs 1 /sys/class/leds/*::capslock/brightness && echo "<span foreground='##$hx_tertiary'>󰘲  <b>CAPS</b></span>" || echo ""
    color = $hl_tertiary
    font_size = 13
    font_family = $UI
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $hl_shadow
    position = -36, 62
    halign = right
    valign = bottom
}
