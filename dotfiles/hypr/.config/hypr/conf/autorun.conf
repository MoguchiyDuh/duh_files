exec-once = waybar # top/bottom bar
exec-once = awww-daemon # wallpaper
exec-once = hypridle # progressive idle: dim -> lock -> screen off -> suspend

# Setup clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = clash-verge
exec-once = flatpak run org.telegram.desktop  -startintray
exec-once = flatpak run com.discordapp.Discord --start-minimized
