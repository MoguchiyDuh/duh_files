exec-once = waybar # top/bottom bar
exec-once = awww-daemon # wallpaper
exec-once = hypridle # progressive idle: dim -> lock -> screen off -> suspend
# Setup clipboard (routed through clipboard.sh so waybar's pill refreshes
# instantly on every store, instead of polling)
exec-once = wl-paste --type text --watch ~/.config/waybar/scripts/clipboard.sh store
exec-once = wl-paste --type image --watch ~/.config/waybar/scripts/clipboard.sh store

exec-once = clash-verge
exec-once = flatpak run org.telegram.desktop  -startintray
exec-once = flatpak run com.discordapp.Discord --start-minimized
