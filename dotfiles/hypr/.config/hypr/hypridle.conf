# Progressive idle escalation ("balanced" profile).
#
# Modelled on the Windows/macOS "balanced, plugged-in" behaviour: warn, dim the
# screen shortly before it goes dark, lock, turn the display off, and finally
# suspend. Every stage that changes visible state restores it on activity.
#
# Ordering note (security): the screen is LOCKED before the display is turned
# off, so waking the machine never briefly reveals the unlocked desktop.
#
# Timings (rounded, desktop / plugged-in). Modelled on Windows "Balanced":
# display off at 10 min, sleep at 30 min, with a short dim ~10 s before the
# display goes dark (Win/macOS dim-as-warning behaviour).
#   notify        8 min
#   dim           9 min 50 s   (~10 s before display off)
#   lock         10 min
#   display off  10 min        (+1 s guard so lock wins the race)
#   suspend      30 min

$timeout_notify   = 480    # 8 min       - gentle warning
$timeout_dim      = 590    # 9 min 50 s  - dim (hardware backlight/DDC) + LEDs
$timeout_lock     = 600    # 10 min      - lock session
$timeout_dpms     = 601    # 10 min      - display off (1s after lock)
$timeout_suspend  = 1800   # 30 min      - suspend to RAM

$dim = ~/.config/hypr/scripts/idle-dim.sh

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    # Respect idle inhibitors (fullscreen video, games, systemd-inhibit / awake mode).
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 3
}

# 1. Warn before anything happens.
listener {
    timeout = $timeout_notify
    on-timeout = notify-send "Idle" "Locking in ~2 min" -u low -t 5000
}

# 2. Dim the display (hardware backlight or DDC/CI only; skipped if the display
#    has no hardware dimming) and peripheral LEDs.
listener {
    timeout = $timeout_dim
    on-timeout = $dim dim
    on-resume = $dim restore
}

# 3. Lock the session (before the display turns off).
listener {
    timeout = $timeout_lock
    on-timeout = loginctl lock-session
}

# 4. Turn the display off. sleep 1 guards the DPMS-vs-lock race that can
#    otherwise freeze Hyprland.
listener {
    timeout = $timeout_dpms
    on-timeout = sleep 1 && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && $dim restore
}

# 5. Suspend. Goes through power.sh so it honours awake mode and the
#    suspend/hibernate state gating (hibernate stays disabled).
listener {
    timeout = $timeout_suspend
    on-timeout = ~/.config/hypr/scripts/power.sh suspend
}
