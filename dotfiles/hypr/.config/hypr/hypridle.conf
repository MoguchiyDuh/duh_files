$timeout_notify   = 480
$timeout_dim      = 590
$timeout_lock     = 600
$timeout_dpms     = 601
$timeout_suspend  = 1800

$dim = ~/.config/hypr/scripts/idle-dim.sh
$power = ~/.config/hypr/scripts/power.sh

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl repl 'hl.dispatch(hl.dsp.dpms("on"))'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = $timeout_notify
    on-timeout = notify-send "Idle" "Locking in ~2 min" -u low -t 5000
}

listener {
    timeout = $timeout_dim
    on-timeout = $dim dim
    on-resume = $dim restore
}

listener {
    timeout = $timeout_lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = $timeout_dpms
    on-timeout = sleep 1 && hyprctl repl 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl repl 'hl.dispatch(hl.dsp.dpms("on"))' && $dim restore
}

listener {
    timeout = $timeout_suspend
    on-timeout = $power suspend
}
