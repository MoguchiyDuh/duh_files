[workspace]
resolver = "2"
members = [
    "common",
    "clipboard",
    "windows",
    "sysctl",
    "binds",
    "transform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
abi_stable = "0.11.1"
anyrun-plugin = { git = "https://github.com/anyrun-org/anyrun", tag = "v26.6.1" }
fuzzy-matcher = "0.3.7"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
common = { path = "common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
