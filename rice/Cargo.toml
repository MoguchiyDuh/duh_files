[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libpulse-binding = "2.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
needless_return = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
