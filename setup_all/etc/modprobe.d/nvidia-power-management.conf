# NVIDIA power management + Wayland modeset.
#
# NVreg_PreserveVideoMemoryAllocations=1 makes the driver save all video memory
# allocations to disk on suspend and restore them on resume. Without it only
# console/X memory is preserved and Wayland/GPU clients can resume with
# corrupted framebuffers or a black screen under GPU load. Required together
# with nvidia-suspend.service / nvidia-resume.service.
#
# NVreg_TemporaryFilePath points the VRAM dump at on-disk storage (/var/tmp,
# ext4) instead of the default /tmp, which is tmpfs (RAM). Recommended by the
# Arch Wiki and the NVIDIA driver README.
#
# NOTE: PreserveVideoMemoryAllocations=1 is known to break resume-from-HIBERNATE
# on some setups. Hibernate is intentionally disabled on this machine, so S3
# suspend-only makes =1 safe here. Do not enable hibernation without revisiting.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp

# Explicit DRM kernel mode setting. Mandatory for Wayland compositors on
# kernel >= 6.11 (fbdev=1). Set explicitly rather than relying on the driver
# default, per Arch Wiki.
options nvidia_drm modeset=1 fbdev=1
